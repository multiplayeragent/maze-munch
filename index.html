  #pad button.on { background: #fff36b66; }
  #pad .u { left: 64px; top: 0; } #pad .l { left: 0; top: 64px; } #pad .r { left: 128px; top: 64px; } #pad .d { left: 64px; top: 128px; }
  @media (max-width: 640px) { #top { width: 118px; font-size: 12px; } #score { font-size: 24px; } #clock { font-size: 24px; } }
  body.short #clock { left: max(14px, env(safe-area-inset-left)); top: calc(max(10px, env(safe-area-inset-top)) + 62px); transform: none; text-align: left; } /* a phone on its side: the maze gets the full height */
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>

<body>
<canvas id="game"></canvas>
<div class="hud" id="score"></div>
<div class="hud" id="clock"></div>
<div class="hud" id="top"></div>

<div id="pad" hidden><button class="u" data-d="3">▲</button><button class="l" data-d="2">◀</button><button class="r" data-d="0">▶</button><button class="d" data-d="1">▼</button></div>
<div id="over" hidden>
  <div class="card">
    <h2 id="overTitle">Round over</h2>

    <button class="go" id="again">Play again</button>
    <p id="overNext" style="margin:8px 0 0"></p>
  </div>
</div>
<script>
/* ═══ MAZE MUNCH · a Multiplayer Agent starter ════════════════════════════════════════
 * Everyone munches dots in one neon maze. Eat a glowing orb and chomp the others.
 * Versus, 2–8 players; bots fill empty seats. Most points when the clock runs out wins.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ every number worth tuning: speeds, points, timers, bots, spooks
 *   MAZE .......... the map as text (edit it to make a new maze), tunnels, distances
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   MOVING ........ square-by-square movement with turn buffering (players, bots, spooks)
 *   ROUND (HOST) .. phases, the clock, dots, orbs, scores, who chomped whom.
 *   SPOOKS (HOST) . the ghosts: leave the house, hunt, run from glowing chompers
 *   BOTS (HOST) ... how a bot chomper picks its next turn
 *   ME ............ my chomper: spawning, steering, eating, getting chomped
 *   OTHERS ........ everyone else's chompers, bots and spooks, eased between snapshots
 *   DRAW .......... the neon maze, dots, orbs, spooks, chompers, effects
 *   HUD & RESULTS . score, clock, standings, banners, results card, leaderboard, sound
 *   INPUT ......... keys, swipes, the touch pad
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player moves ITS OWN chomper and writes its own entity: `s` (one packed JSON
 *     field: x, y, heading, moving, round id, how many chomps it has respawned from)
 *     about 12 times a second, `hb` (heartbeat) once a second, `n`/`c` (name, color).
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields:
 *       `game`   ONE JSON field: round id, version `v`, phase, timestamps (go, final, end,
 *                next round), when each orb comes back, scores, who glows until when,
 *                chomp counts, respawn times, who is out, the results;
 *       `dots`   one character per square ("." a dot, "_" none);
 *       `bots` and `spooks` (~9 times a second).
 *     A new host adopts all four from state and carries on: every timer is a timestamp.
 *   - Intents to the host: "eat" {i: square} when my chomper reaches a dot or an orb (I hide
 *     it at once; the host checks it's still there and scores it) and "again" {} on the
 *     results card. The host decides every chomp from everyone's positions and writes it
 *     into `game`; the victim sees its chomp count go up and respawns itself.
 *   - "fx" events (from the host) are only for effects: bursts, banners, sounds.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "munch-points": each player's best round score, shown on the results card.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  speed: 7,             // chomper speed, squares per second
  spookSpeed: 6.2,      // a spook on the hunt
  scaredSpeed: 4.3,     // a spook running from a glowing chomper
  eyesSpeed: 12,        // an eaten spook's eyes flying home
  lateTurn: 0.3,        // squares past a corner where a late key press still takes the turn
  hitRange: 0.75,       // squares: two things this close touch
  roundMs: 90000,       // one round, from GO to the buzzer
  finalMs: 20000,       // the last 20s of a round: one chomp and you're out
  readyMs: 3000,        // countdown before GO
  resultsMs: 12000,     // the results card shows this long, then the next round starts
  powerMs: 6000,        // how long an orb makes you glow (and able to chomp)
  firstOrbMs: 6000,     // the orbs appear this long after GO (a calm start)
  orbBackMs: 15000,     // an eaten orb grows back after this
  respawnMs: 2500,      // a chomped player waits this long...
  safeMs: 2000,         // ...then blinks this long, safe from chomps
  refillAt: 0.3,        // when only this share of the dots is left, every dot comes back
  scareRange: 7,        // squares: spooks run from a glowing chomper this close
  spooks: 3,            // ghosts in the maze
  spookGapMs: 2500,     // ms between spooks leaving the house at the start
  spookHomeMs: 2000,    // ms an eaten spook rests at home before it comes out again
  seats: 6,             // bots fill the maze up to this many chompers
  botMistake: 0.06,     // chance a bot takes a random turn at a corner
  points: { dot: 10, orb: 50, spook: 200, chomp: 300, chomped: 200, survive: 500 }, // chomped = what the victim loses
  board: "munch-points", // leaderboard name
};
const BOT_NAMES = ["Gulp", "Nom Nom", "Biscuit", "Crunch", "Mochi", "Pickle", "Waffle", "Dumpling"];
const PALETTE = ["#ffd93d", "#3de0ff", "#7dff6b", "#ff8f3d", "#ff5fc4", "#a98bff", "#ff5468", "#4dffc3"];
const SPOOK_TINTS = ["#f1e8ff", "#ffe0f0", "#dcf6ff", "#fff0cf"];
const HUES = [238, 276, 196, 300]; // wall color per round; the final 20s turn them hot pink
const FINAL_HUE = 340;

// ── MAZE ────────────────────────────────────────────────────────────────────────────
// Edit the map to make a new maze (keep every row the same length, and no dead ends):
//   #  wall          .  dot             o  glowing orb      P  where chompers start
//   -  spook door    g  spook house     (space) open floor with no dot
// A row that is open at both ends is a tunnel: walk off one side, come in on the other.
const MAP = [
  "###########################",
  "#..P...................P..#",
  "#o###.###.#######.###.###o#",
  "#.###.###.#######.###.###.#",
  "#..........P...P..........#",
  "#.###.#######.#######.###.#",
  "#.###.#######o#######.###.#",
  "#.###.#######.#######.###.#",
  "#............ ............#",
  "#####.###.###-###.###.#####",
  "#####.###.#ggggg#.###.#####",
  "     .....#ggggg#.....     ",
  "#####.###.#ggggg#.###.#####",
  "#####.###.#######.###.#####",
  "#.........................#",
  "#.###.###.#######.###.###.#",
  "#.###.###.#######.###.###.#",
  "#.###.###.#######.###.###.#",
  "#..........P...P..........#",
  "#.#####.#####o#####.#####.#",
  "#o#####.#####.#####.#####o#",
  "#..P...................P..#",
  "###########################",
];
const MW = MAP[0].length, MH = MAP.length;
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]]; // right, down, left, up
const wrapX = (x) => ((x % MW) + MW) % MW;
const tileAt = (x, y) => (y < 0 || y >= MH ? "#" : MAP[y][wrapX(x)]);
const idx = (x, y) => y * MW + wrapX(x);
/** Can a chomper step onto this square? Not walls, not the spook house. */
const canWalk = (x, y) => !"#-g".includes(tileAt(x, y));
function findAll(ch) { const out = []; MAP.forEach((row, y) => [...row].forEach((c, x) => { if (c === ch) out.push({ x, y }); })); return out; }
const ORBS = findAll("o"), SPAWNS = findAll("P"), HOUSE = findAll("g");
const DOOR = findAll("-")[0], EXIT = { x: DOOR.x, y: DOOR.y - 1 }, HOME = HOUSE[Math.floor(HOUSE.length / 2)];
const ORB_AT = new Map(ORBS.map((o, j) => [idx(o.x, o.y), j])); // square -> orb number
const FRESH_DOTS = MAP.join("").replace(/[^.]/g, "_");          // the dots at the start of a round
const DOT_CELLS = [...FRESH_DOTS].map((c, i) => (c === "." ? i : -1)).filter((i) => i >= 0);
const CORNERS = [{ x: 1, y: 1 }, { x: MW - 2, y: 1 }, { x: MW - 2, y: MH - 2 }, { x: 1, y: MH - 2 }];
/** Steps from every square to (tx, ty), tunnels included. -1 = can't get there. */
function distField(tx, ty, walk) {
  const d = new Int16Array(MW * MH).fill(-1), q = [idx(tx, ty)];
  d[q[0]] = 0;
  for (let k = 0; k < q.length; k++) {
    const i = q[k], x = i % MW, y = (i / MW) | 0;
    for (const [dx, dy] of DIRS) {
      if (y + dy < 0 || y + dy >= MH || !walk(x + dx, y + dy)) continue;
      const j = idx(x + dx, y + dy);
      if (d[j] < 0) { d[j] = d[i] + 1; q.push(j); }
    }
  }
  return d;
}
const notWall = (x, y) => tileAt(x, y) !== "#";
const TO_HOME = distField(HOME.x, HOME.y, notWall), TO_EXIT = distField(EXIT.x, EXIT.y, notWall);
const wrapDx = (a, b) => { const d = Math.abs(a - b) % MW; return Math.min(d, MW - d); };
const near = (a, b) => Math.hypot(wrapDx(a.x, b.x), a.y - b.y);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (list) => list[Math.floor(Math.random() * list.length)];
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'maze-munch',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");
if (ATTRACT) Object.assign(CONFIG, { firstOrbMs: 0, seats: 7, spooks: 4, readyMs: 600, spookGapMs: 400, powerMs: 8000, orbBackMs: 5000, respawnMs: 1200, safeMs: 1000, roundMs: 60000 });

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}

async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const join = MP.join({ ...MP_CONNECT });
    const mp = await Promise.race([join, new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}

const parse = (v, fallback) => { if (typeof v !== "string") return fallback; try { return JSON.parse(v); } catch { return fallback; } };
const memo = new Map();
/** A JSON value from state, parsed once per change (read-only: never mutate what this returns). */
function parseOnce(key, raw, fallback) {
  const m = memo.get(key);
  if (m && m.raw === raw) return m.v;
  const v = parse(raw, fallback);
  memo.set(key, { raw, v });
  return v;
}
const shared = (key, fallback) => parseOnce("shared:" + key, S.shared[key], fallback);
let net = null;      // the room client (real or local)
let S = { entities: { players: {} }, shared: {} }; // latest state
const seenHb = new Map(); // sessionId -> { hb, at } on OUR clock

/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
const isHost = () => livePlayers()[0] === net.sessionId;

// ── MOVING ──────────────────────────────────────────────────────────────────────────
// A mover (my chomper, a bot, a spook): { cx, cy (the last square center it passed),
// t (0..1 of the way to the next one), dir, want (the buffered turn, -1 = none), moving }.
function placeMover(m, x, y, dir) { Object.assign(m, { cx: wrapX(x), cy: y, t: 0, dir, want: -1, moving: false }); }
const posOf = (m) => ({ x: m.cx + DIRS[m.dir][0] * m.t, y: m.cy + DIRS[m.dir][1] * m.t });
const openDir = (m, d, walk) => d >= 0 && walk(m.cx + DIRS[d][0], m.cy + DIRS[d][1]);

/**
 * Move along the grid. At every square center `onCenter` runs (eat, arrive; it may stop the
 * mover by clearing `moving`), then `think` may change `want`, then the mover takes the
 * buffered turn if that way is open, else goes straight on, else stops at the wall.
 * Turning back happens at once, even halfway between squares.
 */
function stepMover(m, dt, speed, walk, think, onCenter) {
  if (!m.moving) {
    if (think) think(m);
    if (!openDir(m, m.want, walk)) return;
    m.dir = m.want; m.moving = true;
  }
  if (m.want === (m.dir + 2) % 4) {
    if (m.t > 0) { m.cx = wrapX(m.cx + DIRS[m.dir][0]); m.cy += DIRS[m.dir][1]; m.t = 1 - m.t; m.dir = m.want; }
    else if (openDir(m, m.want, walk)) m.dir = m.want;
  }
  m.t += speed * dt;
  while (m.t >= 1) {
    m.t -= 1;
    m.cx = wrapX(m.cx + DIRS[m.dir][0]); m.cy += DIRS[m.dir][1];
    if (onCenter) onCenter(m);
    if (!m.moving) { m.t = 0; break; }
    if (think) think(m);
    if (m.want !== m.dir && openDir(m, m.want, walk)) m.dir = m.want;
    else if (!openDir(m, m.dir, walk)) { m.t = 0; m.moving = false; break; }
  }
}
/** Put a mover back on the grid from a snapshot (x, y, heading): the last square center it passed. */
function placeFrom(m, x, y, d, moving) {
  d = DIRS[d] ? d : 0;
  const [dx, dy] = DIRS[d];
  const cx = dx > 0 ? Math.floor(x) : dx < 0 ? Math.ceil(x) : Math.round(x), cy = dy > 0 ? Math.floor(y) : dy < 0 ? Math.ceil(y) : Math.round(y);
  placeMover(m, cx, cy, d);
  m.t = Math.min(0.99, Math.abs(x - cx) + Math.abs(y - cy)); m.moving = !!moving; m.want = d;
}

// ── ROUND (HOST) ────────────────────────────────────────────────────────────────────
const CHASE = 0, SCARED = 1, EYES = 2, HOUSED = 3; // spook modes
const host = { acting: false, g: null, dots: [], bots: new Map(), spooks: [], dirtyG: false, dirtyDots: false, lastG: 0, lastDots: 0, lastMobs: 0, lastSpawn: 0, lastPrune: 0 };
/** The round: the host's live copy, or what state says. Everyone but the host only reads it. */
const game = () => (host.acting ? host.g : shared("game", null));
/** The dots, one character per square ("." = a dot), the host's copy or state's. */
const dotsNow = () => (host.acting ? host.dots : typeof S.shared.dots === "string" && S.shared.dots.length === MW * MH ? S.shared.dots : FRESH_DOTS);

function writeGame(now) { host.g.v++; host.lastG = now; host.dirtyG = false; net.setShared("game", JSON.stringify(host.g)); }
function writeDots(now) { host.lastDots = now; host.dirtyDots = false; net.setShared("dots", host.dots.join("")); }

/** Become host: take over the round, dots, bots and spooks exactly as state has them. */
function adopt() {
  host.acting = true;
  host.g = parse(S.shared.game, null);
  host.dots = (typeof S.shared.dots === "string" && S.shared.dots.length === MW * MH ? S.shared.dots : FRESH_DOTS).split("");
  host.bots.clear();
  for (const b of parse(S.shared.bots, [])) {
    const bot = { id: b.i, name: b.n, color: b.c, dead: !!b.dn, fear: +b.f || 4, greed: +b.g || 9, pace: +b.p || 1 };
    placeFrom(bot, +b.x || 0, +b.y || 0, b.d, b.m);
    host.bots.set(bot.id, bot);
  }
  host.spooks = parse(S.shared.spooks, []).map(([x, y, d, mode, rel, , moving], i) => {
    const sp = { i, mode: mode | 0, rel: +rel || 0, scarer: null, flash: false };
    placeFrom(sp, +x || 0, +y || 0, d, moving);
    return sp;
  });
  if (!host.g) newRound(1); // an empty room: the first round
  else if (host.spooks.length !== CONFIG.spooks) resetSpooks(host.g.go);
  host.dirtyG = host.dirtyDots = true;
}

/** A new round: fresh dots, everyone to a start square, spooks home. Dots first, then the round. */
function newRound(id) {
  const now = Date.now(), go = now + CONFIG.readyMs, end = go + CONFIG.roundMs;
  const order = shuffle(SPAWNS.map((_, k) => k)), sp = {};
  [...livePlayers(), ...host.bots.keys()].forEach((pid, k) => (sp[pid] = order[k % order.length]));
  host.dots = FRESH_DOTS.split("");
  host.g = { id, v: host.g ? host.g.v : 0, ph: "ready", go, fin: end - CONFIG.finalMs, end, next: 0, orbs: ORBS.map(() => go + CONFIG.firstOrbMs),

/** An "eat" intent (or a bot or the host eating): take the dot or orb on square i if it's there. */

  const left = Math.max(0, Math.ceil(((g.ph === "ready" ? g.go : g.end) - t) / 1000));
  $("clock").className = "hud" + (final ? " final" : "");
  $("clock").innerHTML = g.ph === "over" ? "Round over" : `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}<small>${g.ph === "ready" ? "get ready" : final ? "final: one chomp and you're out" : `round ${g.id}`}</small>`;
  if (g.ph === "ready") { if (left !== lastCount && left <= 3) { lastCount = left; banner(String(left || "GO!"), "", 900); sfx("go"); } }
  else if (lastCount > 0 && g.ph === "play") { lastCount = 0; banner("GO!", "", 700); sfx("go"); }
  if (final && finalFor !== g.id) { finalFor = g.id; banner(`Final ${Math.round(CONFIG.finalMs / 1000)} seconds!`, "One chomp and you're out", 2400); sfx("final"); }
  const ranked = chompers().sort((a, b) => (g.sc[b.id] || 0) - (g.sc[a.id] || 0)), max = innerWidth < 640 || innerHeight < 500 ? 4 : 6;
  const rows = ranked.slice(0, max), mine = ranked.findIndex((c) => c.mine);
  if (mine >= max) rows[max - 1] = ranked[mine]; // my own row always shows, even when I am not near the top
  $("top").innerHTML = rows.map((c) => `<div class="${c.mine ? "me" : ""} ${c.out ? "out" : ""}"><i style="background:${c.color}"></i><span>${esc(c.mine ? "You" : c.name)}</span><b>${g.sc[c.id] || 0}</b></div>`).join("");
  if (now > msgUntil) $("msg").style.opacity = 0;
  if (!startedAt) startedAt = now;
  $("hint").style.opacity = g.ph !== "over" && now - startedAt < 14000 && (!me.firstMove || now - me.firstMove < 7000) ? 1 : 0;
  $("hint").innerHTML = `<span>${touchUI ? "Swipe or use the pad to move" : "Arrow keys or WASD to move"} · eat a glowing orb, then chomp the others</span>`;
  showOver(g, t);
}

function showOver(g, t) {
  $("over").hidden = g.ph !== "over";
  if (g.ph !== "over") { overFor = -1; return; }
  const res = g.res || [], top = res[0], mine = res.find((r) => r.i === me.id);
  if (overFor !== g.id) {
    overFor = g.id;
    $("overTitle").textContent = !top ? "Round over" : g.draw ? "It's a draw!" : top.i === me.id ? "You win!" : `${top.n} wins!`;
    $("overSub").textContent = mine ? `You scored ${mine.s}${mine.sv ? ` · +${CONFIG.points.survive} for surviving the final` : ""}` : "You joined mid-round: next one's yours";
    $("standings").innerHTML = res.map((r) => `<li class="${r.i === me.id ? "me" : ""}"><i style="background:${esc(r.c)}"></i>${esc(r.i === me.id ? "You" : r.n)}${r.b ? " (bot)" : ""}<span>${r.s}</span></li>`).join("");
    showBoard(mine ? mine.s : 0, !!mine);
  }
  const asked = g.rdy.includes(me.id);
  $("again").textContent = asked ? "Waiting for the others…" : "Play again";
  $("again").className = "go" + (asked ? " wait" : "");
  $("overNext").textContent = `Next round in ${Math.max(0, Math.ceil((g.next - t) / 1000))}s`;
}
function showBoard(score, played) {
  const list = $("board");
  if (!board) { list.innerHTML = '<li class="note">Leaderboards need a connection.</li>'; return; }
  list.innerHTML = '<li class="note">Loading the leaderboard…</li>';
  const sent = played && score > 0 ? board.submit(score).catch(() => null) : Promise.resolve();
  sent.then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : '<li class="note">No scores yet. Set the first.</li>';
  }).catch(() => { list.innerHTML = "<li class='note'>Couldn't load the leaderboard.</li>"; });
}
$("again").onclick = () => { unlockAudio(); if (host.acting) applyAgain(net.sessionId); else net.send("again", {}); };

// Sound: short blips, started by the first key or tap (browsers block sound before that).
let audio = null, waka = false;
function unlockAudio() { if (!audio && !ATTRACT) { try { audio = new AudioContext(); } catch { audio = null; } } }
const SOUNDS = { // [start Hz, end/start, seconds, wave, volume]
  dot: [620, 1.3, 0.06, "triangle", 0.05], orb: [300, 3, 0.4, "square", 0.06], chomp: [700, 0.3, 0.28, "square", 0.09],
  chomped: [520, 0.2, 0.7, "sawtooth", 0.08], spook: [400, 3.5, 0.3, "triangle", 0.1], go: [660, 1, 0.15, "square", 0.05],
  final: [330, 2, 0.5, "sawtooth", 0.07], refill: [500, 2, 0.35, "triangle", 0.08],
};
function sfx(kind) {
  if (!audio) return;
  const [f0, up, dur, type, vol] = SOUNDS[kind], t = audio.currentTime, o = audio.createOscillator(), gn = audio.createGain();
  const f = kind === "dot" ? f0 * ((waka = !waka) ? 1 : 0.8) : f0;
  o.type = type; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * up, t + dur);
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(gn).connect(audio.destination); o.start(t); o.stop(t + dur + 0.02);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
const KEYS = { arrowright: 0, d: 0, arrowdown: 1, s: 1, arrowleft: 2, a: 2, arrowup: 3, w: 3 };
addEventListener("keydown", (e) => {
  unlockAudio();
  const d = KEYS[e.key.toLowerCase()];
  if (d === undefined || e.ctrlKey || e.metaKey || e.altKey) return; // leave browser shortcuts (Ctrl+S, Ctrl+D) alone
  e.preventDefault(); steer(d);
});
// Swipe anywhere: every 18px of drag in a new direction is a turn.
let swipe = null;
cv.addEventListener("pointerdown", (e) => { e.preventDefault(); unlockAudio(); if (e.button === 0) swipe = { id: e.pointerId, x: e.clientX, y: e.clientY }; });
cv.addEventListener("contextmenu", (e) => e.preventDefault()); // right-click doesn't open the browser menu over the game
cv.addEventListener("pointermove", (e) => {
  if (!swipe || swipe.id !== e.pointerId) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  if (Math.hypot(dx, dy) < 18) return;
  steer(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 0 : 2) : (dy > 0 ? 1 : 3));
  swipe.x = e.clientX; swipe.y = e.clientY;
});
for (const ev of ["pointerup", "pointercancel"]) addEventListener(ev, (e) => { if (swipe && swipe.id === e.pointerId) swipe = null; });
for (const b of document.querySelectorAll("#pad button")) {
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); unlockAudio(); steer(+b.dataset.d); b.classList.add("on"); });
  for (const ev of ["pointerup", "pointercancel", "pointerleave"]) b.addEventListener(ev, () => b.classList.remove("on"));
}
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
addEventListener("resize", fit); addEventListener("orientationchange", fit);

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0, wokeAt = -1e9, lastTick = performance.now();
function frame(now) {
  requestAnimationFrame(frame); // first, so one exception can't stop the game
  // This tab was frozen or hidden: someone else may have run the round meanwhile. Let the
  // state catch up for a moment, then adopt it fresh (never carry on from a stale copy).
  // (Timed with performance.now(), not `now`: the first frame after a freeze can be stamped from before it ended.)
  const t0 = performance.now();
  if (t0 - lastTick > 1500) { host.acting = false; wokeAt = t0; }
  lastTick = t0;
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  const hosting = isHost() && t0 - wokeAt > 700;
  if (!hosting) host.acting = false;
  syncViews(dt, now);
  if (hosting) hostTick(dt, now);
  myTick(dt);
  draw(dt, now);
  if (now - lastHud > 150) { lastHud = now; hud(now); }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("eat", (msg, from) => { if (isHost() && msg && host.acting) applyEat(from, msg.i); });
  net.on("again", (msg, from) => { if (isHost() && host.acting) applyAgain(from); });
  net.on("fx", (msg) => onFx(msg));
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...botColors()]);
  me.id = net.sessionId; myColor = PALETTE.find((c) => !taken.has(c)) || pick(PALETTE);
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  fit();
  last = performance.now(); // joining can take a few seconds: that isn't a frozen tab
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
